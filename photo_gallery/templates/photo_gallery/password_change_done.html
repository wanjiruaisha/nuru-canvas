{% extends 'photo_gallery/base.html' %}

{% block title %}
    Password Changed | NuruCanvas
{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg rounded-3xl bg-white p-8 text-center shadow-lg">
    <div class="text-5xl">✓</div>

    <h1 class="mt-4 text-3xl font-bold">
        Password changed
    </h1>

    <p class="mt-3 text-slate-600">
        Your password was updated securely.
    </p>

    <a
        href="{% url 'photo_gallery:profile' %}"
        class="mt-7 inline-block rounded-lg bg-amber-500 px-5 py-3 font-semibold text-slate-950"
    >
        Return to profile
    </a>
</div>
{% endblock %}
