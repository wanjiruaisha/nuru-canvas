<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}NuruCanvas{% endblock %}
    </title>

    <!-- Temporary Tailwind setup for development -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
    <nav class="bg-slate-950 text-white shadow-lg">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
            <a
                href="{% url 'photo_gallery:home' %}"
                class="text-2xl font-bold tracking-wide"
            >
                NuruCanvas
            </a>

            <span class="text-sm text-slate-300">
                Stories captured in light
            </span>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-5 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="mt-12 bg-slate-950 px-5 py-6 text-center text-sm text-slate-400">
        &copy; 2026 NuruCanvas
    </footer>
</body>
</html>
